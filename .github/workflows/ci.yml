name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure, test, and smoke-run C++20 core (AVX2 + OpenMP)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          ./build/tinyinfer_bench
          ./build/tinyinfer_cli --synthetic --dtype q8_0 --max-tokens 16
      - name: Build nanobind Python bindings and verify full test suite
        run: |
          pip install -e ".[dev]"
          ruff check python tests benchmarks dashboard
          pytest -v
          python3 benchmarks/bench_kernels.py --iters 15
